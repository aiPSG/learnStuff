<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TermQuest – Terme lernen, verstehen und üben (Selbstdiagnosebogen Terme II).">
  <meta name="theme-color" content="#6d28d9">
  <title>TermQuest – Terme II</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="TermQuest Startseite"><span class="logo-icon">🧮</span><span class="logo-text">Term<b>Quest</b></span></a>
    <div class="hdr-right">
      <div class="xp-chip" title="Erfahrungspunkte">
        <span id="hdr-level" class="lvl">Lv 1</span>
        <span class="mini-bar"><span id="hdr-xpbar"></span></span>
        <span id="hdr-xp">0 XP</span>
      </div>
      <div class="coin-chip" title="Credits für den Avatar-Shop">🪙 <span id="hdr-credits">0</span></div>
      <button id="btn-mute" class="icon-btn" data-silent aria-label="Ton ausschalten">🔊</button>
      <button id="btn-settings" class="icon-btn" aria-label="Einstellungen für Eltern">⚙️</button>
      <a id="hdr-avatar" class="hdr-avatar" href="#/shop" aria-label="Avatar-Shop"></a>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <noscript><p style="padding:2rem">Bitte JavaScript aktivieren, um TermQuest zu benutzen.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/mathterm.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/tutor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
